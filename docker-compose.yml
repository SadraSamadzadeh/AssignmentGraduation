services:
    postgres:
        image: postgres:15-alpine
        container_name: matching_postgres
        environment:
            POSTGRES_DB: matching_db
            POSTGRES_USER: matching_user
            POSTGRES_PASSWORD: matching_password
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - matching_network

    redis:
        image: redis:7-alpine
        container_name: matching_redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - matching_network

    rabbitmq:
        image: rabbitmq:3.12-management-alpine
        container_name: matching_rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: admin
            RABBITMQ_DEFAULT_PASS: admin
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        networks:
            - matching_network

    app:
        build:
            context: ./laravel-api
            dockerfile: Dockerfile
        container_name: matching_app
        ports:
            - "8000:8000"
        environment:
            APP_ENV: production
            APP_DEBUG: false
            APP_KEY: base64:YOUR_APP_KEY_HERE
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: matching_db
            DB_USERNAME: matching_user
            DB_PASSWORD: matching_password
            CACHE_DRIVER: file
            SESSION_DRIVER: file
            QUEUE_CONNECTION: rabbitmq
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            RABBITMQ_USER: admin
            RABBITMQ_PASSWORD: admin
            RABBITMQ_VHOST: /
            REDIS_HOST: redis
            REDIS_PORT: 6379
        volumes:
            - ./laravel-api/storage:/var/www/storage
        depends_on:
            - postgres
            - redis
            - rabbitmq
        networks:
            - matching_network

volumes:
    postgres_data:
    redis_data:
    rabbitmq_data:

networks:
    matching_network:
        driver: bridge
