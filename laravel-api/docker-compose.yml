# ============================================================================
# Docker Compose - LOCAL DEVELOPMENT ONLY
# ============================================================================
# For DEVELOPMENT: Use this file (docker-compose up -d)
# For PRODUCTION: Use Kubernetes manifests in k8s/ folder
# ============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: assignment_postgres
    environment:
      POSTGRES_DB: assignment_graduation
      POSTGRES_USER: assignment_user
      POSTGRES_PASSWORD: postgres_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assignment_user -d assignment_graduation"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: assignment_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis_password_123
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "redis_password_123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # RabbitMQ Message Queue
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: assignment_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: rabbitmq_password_123
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # Laravel API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: assignment_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env.local
    ports:
      - "80:80"
    volumes:
      - ./storage:/var/www/html/storage
      - ./public:/var/www/html/public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Laravel Queue Worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: assignment_worker
    depends_on:
      - postgres
      - redis
      - rabbitmq
    env_file:
      - .env.local
    volumes:
      - ./storage:/var/www/html/storage

  # ---------------------------------------------------------------------------
  # Laravel Scheduler
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduler
    container_name: assignment_scheduler
    depends_on:
      - postgres
      - redis
    env_file:
      - .env.local
    volumes:
      - ./storage:/var/www/html/storage

volumes:
  postgres_data:
    driver: local
