# ============================================================================
# Docker Compose for LOCAL DEVELOPMENT
# ============================================================================
# This is a SIMPLE setup for development. Just run: docker-compose up
# Everything runs in separate containers but connects automatically via Docker networking

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: assignment_postgres
    environment:
      POSTGRES_DB: assignment_graduation
      POSTGRES_USER: assignment_user
      POSTGRES_PASSWORD: postgres_password_123
    ports:
      - "5432:5432"  # Expose to host so you can connect with DB tools
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assignment_user -d assignment_graduation"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: assignment_redis
    ports:
      - "6379:6379"  # Expose to host
    command: redis-server --requirepass redis_password_123
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # RabbitMQ Message Queue
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: assignment_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: rabbitmq_password_123
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI - http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # Laravel API (Nginx + PHP-FPM)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: assignment_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Application
      APP_NAME: "USF Sport Assignment"
      APP_ENV: local
      APP_KEY: base64:YourSecretAppKeyHere1234567890ABCDEF
      APP_DEBUG: "true"
      APP_URL: http://localhost

      # Database
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: assignment_graduation
      DB_USERNAME: assignment_user
      DB_PASSWORD: postgres_password_123

      # Cache (Redis)
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: redis_password_123
      REDIS_PORT: 6379

      # Queue (RabbitMQ)
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: rabbitmq_password_123
      RABBITMQ_VHOST: /
      RABBITMQ_QUEUE: default

      # Logging
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
    ports:
      - "80:80"  # Access API at http://localhost
    volumes:
      - ./storage:/var/www/html/storage  # Persist logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Laravel Queue Workers
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: assignment_worker
    depends_on:
      - postgres
      - redis
      - rabbitmq
    environment:
      # Same as API
      APP_NAME: "USF Sport Assignment"
      APP_ENV: local
      APP_KEY: base64:YourSecretAppKeyHere1234567890ABCDEF
      APP_DEBUG: "true"
      
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: assignment_graduation
      DB_USERNAME: assignment_user
      DB_PASSWORD: postgres_password_123
      
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: redis_password_123
      REDIS_PORT: 6379
      
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: rabbitmq_password_123
      RABBITMQ_VHOST: /
      RABBITMQ_QUEUE: default
      
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
    volumes:
      - ./storage:/var/www/html/storage

  # ---------------------------------------------------------------------------
  # Laravel Scheduler (Cron)
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduler
    container_name: assignment_scheduler
    depends_on:
      - postgres
      - redis
    environment:
      # Same as API
      APP_NAME: "USF Sport Assignment"
      APP_ENV: local
      APP_KEY: base64:YourSecretAppKeyHere1234567890ABCDEF
      APP_DEBUG: "true"
      
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: assignment_graduation
      DB_USERNAME: assignment_user
      DB_PASSWORD: postgres_password_123
      
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: redis_password_123
      REDIS_PORT: 6379
      
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
    volumes:
      - ./storage:/var/www/html/storage

# Volumes for data persistence
volumes:
  postgres_data:
    driver: local
