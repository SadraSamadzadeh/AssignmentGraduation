version: "3.8"

services:
    postgres:
        image: postgres:15-alpine
        container_name: zipper_postgres
        environment:
            POSTGRES_DB: zipper_db
            POSTGRES_USER: zipper_user
            POSTGRES_PASSWORD: zipper_pass_2026
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U zipper_user -d zipper_db"]
            interval: 5s
            timeout: 5s
            retries: 10

    rabbitmq:
        image: rabbitmq:3-management-alpine
        container_name: zipper_rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: zipper_admin
            RABBITMQ_DEFAULT_PASS: zipper_rabbitmq_2026
        ports:
            - "5672:5672"
            - "15672:15672"
        healthcheck:
            test: rabbitmq-diagnostics -q check_port_connectivity
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: zipper_app
        ports:
            - "80:80"
        volumes:
            - ./storage:/var/www/html/storage
            - ./.env:/var/www/html/.env
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        command: >
            sh -c "
              sleep 15 &&
              php artisan migrate --force &&
              (php artisan rabbitmq:init || echo 'RabbitMQ init skipped') &&
              /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf
            "

volumes:
    postgres_data:
