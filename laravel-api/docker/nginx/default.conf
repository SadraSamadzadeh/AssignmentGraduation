# =============================================================================
# Nginx Virtual Host Configuration for Laravel
# =============================================================================
# Purpose: Configure Nginx to serve the Laravel application
# Handles static files, routes requests to PHP-FPM, and applies security headers

# Upstream PHP-FPM Configuration
# -------------------------------
# Defines connection pool to PHP-FPM service
# keepalive: Maintains persistent connections to reduce overhead
upstream php-fpm {
    server 127.0.0.1:9000;
    keepalive 16;
}

# Main Server Block
# -----------------
server {
    # Listen on port 80 for both IPv4 and IPv6
    listen 80;
    listen [::]:80;
    
    # Server name (use _ for default/catch-all)
    server_name _;
    
    # Document root points to Laravel's public directory
    # All requests are served from here
    root /var/www/html/public;
    
    # Default files to serve when directory is requested
    index index.php index.html;
    
    # Security Headers
    # ----------------
    # X-Frame-Options: Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # X-Content-Type-Options: Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # X-XSS-Protection: Enable browser XSS protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Gzip Compression
    # ----------------
    # Compresses responses to reduce bandwidth and improve speed
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    
    # Client Request Limits
    # ---------------------
    # client_max_body_size: Maximum request body size (for file uploads)
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    
    # Timeouts
    # --------
    # Prevent slow clients from holding connections
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;
    
    # Health Check Endpoint
    # ---------------------
    # Special handling for health checks (no rate limiting, no logging)
    # Used by Docker Swarm to determine container health
    location = /api/health {
        access_log off;  # Don't log health checks (reduces noise)
        try_files $uri /index.php?$query_string;
    }
    
    # Main Location Block
    # -------------------
    # Routes all requests through Laravel's front controller
    location / {
        # try_files: First check if file exists, then directory, then route to index.php
        # This allows Nginx to serve static files directly without PHP
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP Processing
    # --------------
    # Handle all .php files by passing to PHP-FPM
    location ~ \.php$ {
        # Pass request to PHP-FPM upstream
        fastcgi_pass php-fpm;
        
        # Default PHP file
        fastcgi_index index.php;
        
        # Set script filename using realpath_root for security
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        
        # Include standard FastCGI parameters
        include fastcgi_params;
        
        # Timeouts for Long-Running Requests
        # Queue job dispatching can take time
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        
        # Buffer Settings
        # Optimized for Laravel responses
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        
        # Hide PHP version in HTTP headers (security)
        fastcgi_hide_header X-Powered-By;
    }
    
    # Deny Access to Hidden Files
    # ----------------------------
    # Block access to .git, .env, .htaccess, etc.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny Access to Sensitive Files
    # -------------------------------
    # Block direct access to configuration and build files
    location ~ ^/(\.env|composer\.json|composer\.lock|package\.json|package-lock\.json|webpack\.mix\.js) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Static File Caching
    # -------------------
    # Cache static assets in browser for 30 days
    # Reduces server load and improves user experience
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;  # Don't log static file requests
    }
    
    # Logging
    # -------
    # Access log: Records all requests
    access_log /var/log/nginx/access.log combined;
    
    # Error log: Records errors and warnings
    error_log /var/log/nginx/error.log warn;
}
