# =============================================================================
# Nginx Main Configuration
# =============================================================================
# Purpose: Global Nginx settings for performance, security, and logging
# This configuration applies to all virtual hosts

# User and Process Settings
# --------------------------
# user: Run Nginx worker processes as this user (nginx:nginx for security)
user nginx;

# worker_processes: Number of worker processes
# auto: Automatically detect based on CPU cores
worker_processes auto;

# worker_rlimit_nofile: Max file descriptors per worker
# Allows handling many simultaneous connections
worker_rlimit_nofile 65535;

# error_log: Global error logging
error_log /var/log/nginx/error.log warn;

# pid: Process ID file location
pid /var/run/nginx.pid;

# Events Block
# ------------
# Configuration for connection processing
events {
    # worker_connections: Max simultaneous connections per worker
    # 4096 allows handling ~16,000 connections with 4 workers
    worker_connections 4096;
    
    # use: Connection processing method
    # epoll: Most efficient method for Linux
    use epoll;
    
    # multi_accept: Accept multiple connections at once
    # Improves performance under high load
    multi_accept on;
}

# HTTP Block
# ----------
# Main HTTP server configuration
http {
    # MIME Types
    # ----------
    # Include standard MIME type definitions
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging Format
    # --------------
    # Custom log format with request timing and upstream response time
    # Useful for performance monitoring and debugging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    # Access log using custom format
    access_log /var/log/nginx/access.log main;
    
    # Performance Optimizations
    # -------------------------
    # sendfile: Use kernel sendfile() for file transfers (faster)
    sendfile on;
    
    # tcp_nopush: Send headers in one packet (with sendfile)
    tcp_nopush on;
    
    # tcp_nodelay: Don't buffer data-sends (better for small transfers)
    tcp_nodelay on;
    
    # keepalive_timeout: Keep connections alive for this long
    keepalive_timeout 65;
    
    # keepalive_requests: Max requests per keepalive connection
    keepalive_requests 100;
    
    # types_hash_max_size: Hash table size for MIME types
    types_hash_max_size 2048;
    
    # server_tokens: Hide Nginx version in error pages and headers (security)
    server_tokens off;
    
    # Buffer Settings
    # ---------------
    # Optimized for typical Laravel API requests
    client_body_buffer_size 128k;
    client_max_body_size 100M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    
    # Proxy Settings
    # --------------
    # Configuration for proxying requests to upstream services
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    
    # Gzip Compression
    # ----------------
    # Global gzip settings (can be overridden in virtual hosts)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    
    # gzip_disable: Disable gzip for old IE6 browsers
    gzip_disable "msie6";
    
    # Include Virtual Host Configurations
    # ------------------------------------
    # Load all .conf files from conf.d directory
    # This includes our Laravel virtual host configuration
    include /etc/nginx/conf.d/*.conf;
}
