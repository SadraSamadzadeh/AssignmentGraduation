; =============================================================================
; OPcache Configuration for Production
; =============================================================================
; Purpose: Configure PHP OPcache for maximum performance
; OPcache stores precompiled script bytecode in shared memory, eliminating
; the need for PHP to load and parse scripts on each request

; Enable OPcache
; --------------
opcache.enable = 1
opcache.enable_cli = 1

; Memory Configuration
; --------------------
; opcache.memory_consumption: Memory allocated to OPcache (MB)
; 256MB is sufficient for most Laravel applications
opcache.memory_consumption = 256

; opcache.interned_strings_buffer: Memory for interned strings (MB)
; Stores common strings used across scripts (class names, function names)
opcache.interned_strings_buffer = 16

; opcache.max_accelerated_files: Maximum number of files to cache
; Laravel typically has 5000-10000 files, setting to 10000 for safety
opcache.max_accelerated_files = 10000

; Revalidation Settings
; ----------------------
; opcache.revalidate_freq: How often to check for file changes (seconds)
; Set to 0 in production because files don't change (immutable containers)
; Docker container rebuilds on code changes, so no need to revalidate
opcache.revalidate_freq = 0

; opcache.validate_timestamps: Check if files have been modified
; Set to 0 in production (disabled) for maximum performance
; Files in container are immutable, so no need to check timestamps
opcache.validate_timestamps = 0

; Advanced Settings
; -----------------
; opcache.save_comments: Save code comments in opcode cache
; Required for Laravel (annotations, docblocks used by framework)
opcache.save_comments = 1

; opcache.fast_shutdown: Use fast shutdown sequence
; Speeds up PHP shutdown by freeing memory in single operation
opcache.fast_shutdown = 1

; opcache.enable_file_override: Use OPcache's file existence checks
; Improves performance of file_exists(), is_file(), is_readable() calls
opcache.enable_file_override = 1

; opcache.max_wasted_percentage: Max percentage of wasted memory before restart
; OPcache will restart if more than 10% of memory is wasted
opcache.max_wasted_percentage = 10

; JIT Compilation (PHP 8.2+)
; ---------------------------
; opcache.jit_buffer_size: Memory for JIT compilation
; JIT (Just-In-Time) compiles hot code paths to machine code
opcache.jit_buffer_size = 128M

; opcache.jit: JIT mode configuration
; 1255 is recommended for production (function-level JIT with profiling)
opcache.jit = 1255
