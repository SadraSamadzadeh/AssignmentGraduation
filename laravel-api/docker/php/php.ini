; =============================================================================
; PHP Custom Configuration for Laravel Production
; =============================================================================
; Purpose: Override default PHP settings for optimal Laravel performance

; Memory Management
; -----------------
; memory_limit: Maximum memory a single script can consume
; Set to 512M to handle large queue jobs and data processing
memory_limit = 512M

; File Upload Configuration
; -------------------------
; post_max_size: Maximum size of POST data (forms, API requests)
; upload_max_filesize: Maximum size of uploaded files
; Both set to 100M to handle large video metadata or tracking data uploads
post_max_size = 100M
upload_max_filesize = 100M

; Execution Time Limits
; ---------------------
; max_execution_time: Maximum time a script can run (seconds)
; Set to 300 (5 minutes) to allow long-running queue jobs
max_execution_time = 300

; max_input_time: Maximum time to parse input data (POST, GET, file uploads)
; Set to 120 seconds for large data uploads
max_input_time = 120

; Session Configuration
; ---------------------
; Session settings for Laravel (though we use Redis for sessions)
session.gc_maxlifetime = 1440
session.gc_probability = 1
session.gc_divisor = 1000

; Error Reporting
; ---------------
; Display errors: Off in production (security)
; Log errors: On to file for debugging
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Security Settings
; -----------------
; Disable expose_php to hide PHP version in HTTP headers (security)
expose_php = Off

; Performance Settings
; --------------------
; realpath_cache_size: Cache for file path resolutions
; Increases performance by reducing filesystem lookups
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Date/Time
; ---------
; Default timezone (override with TZ environment variable in Docker)
date.timezone = UTC
