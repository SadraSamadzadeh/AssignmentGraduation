# =============================================================================
# Supervisor Configuration for API Container
# =============================================================================
# Purpose: Manage multiple processes (nginx + php-fpm) in a single container
# Supervisor keeps processes running and automatically restarts them on failure

# Supervisor Daemon Settings
# ---------------------------
[supervisord]
# nodaemon: Run in foreground (required for Docker containers)
# If set to false, container would exit immediately
nodaemon=true

# user: Run supervisord as root (required to manage nginx and php-fpm)
user=root

# logfile: Main supervisor log file
logfile=/var/log/supervisor/supervisord.log

# pidfile: Process ID file location
pidfile=/var/run/supervisord.pid

# loglevel: Logging verbosity (info, debug, warn, error)
loglevel=info

# Program: PHP-FPM
# ----------------
# Manages the PHP FastCGI Process Manager
# PHP-FPM handles all PHP execution for Laravel
[program:php-fpm]
# command: Start PHP-FPM in foreground mode
command=php-fpm -F

# autostart: Start automatically when supervisor starts
autostart=true

# autorestart: Restart if process crashes
# unexpected: Only restart if exit code is not 0
autorestart=unexpected

# startretries: Number of restart attempts before giving up
startretries=3

# stderr/stdout: Log file locations
stderr_logfile=/var/log/php-fpm.err.log
stdout_logfile=/var/log/php-fpm.out.log

# stdout_logfile_maxbytes: Max log file size before rotation
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

# priority: Start order (lower number starts first)
# PHP-FPM must start before nginx
priority=5

# Program: Nginx
# --------------
# Manages the Nginx web server
# Nginx handles HTTP requests and forwards PHP requests to PHP-FPM
[program:nginx]
# command: Start Nginx in foreground mode
# daemon off: Prevents Nginx from forking to background
command=nginx -g 'daemon off;'

# autostart: Start automatically when supervisor starts
autostart=true

# autorestart: Restart if process crashes
autorestart=unexpected

# startretries: Number of restart attempts before giving up
startretries=3

# stderr/stdout: Log file locations
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log

# stdout_logfile_maxbytes: Max log file size before rotation
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

# priority: Start order (higher number starts later)
# Nginx starts after PHP-FPM is ready
priority=10

# depends_on: Wait for php-fpm to start before starting nginx
# Ensures PHP-FPM is ready to handle requests
depends_on=php-fpm
